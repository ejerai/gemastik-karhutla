name: Update Karhutla Dashboard Data

# Menjalankan pipeline harian: tarik data FIRMS + GPM terbaru (jika ada
# script fetch tambahan), lalu jalankan scripts/generate_dashboard_data.py
# untuk memperbarui public/dashboard_data.json dan commit hasilnya.
# Vercel akan otomatis re-deploy setelah commit masuk ke branch main.

on:
  schedule:
    - cron: "0 22 * * *"  # 05:00 WIB setiap hari
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # TODO: tambahkan step fetch data FIRMS/GPM terbaru di sini jika
      # sumber data sudah disiapkan (mis. download ke folder data/).
      # - name: Fetch latest FIRMS + GPM data
      #   run: python3 scripts/fetch_latest_data.py

      - name: Generate dashboard_data.json
        run: python3 scripts/generate_dashboard_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dashboard_data.json
          git diff --staged --quiet || git commit -m "chore: update dashboard_data.json [automated]"
          git push
